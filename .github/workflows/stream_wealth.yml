name: "💰 Ronaldo vs Elon Musk Wealth Battle Stream"

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: "Stream Key for Wealth Battle Live"
        required: false
      quality:
        description: "Stream Quality"
        required: false
        default: "1080p"
        type: choice
        options:
          - 720p
          - 1080p

permissions:
  contents: read

jobs:
  wealth-stream:
    name: "💰 Wealth Battle Stream"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. Install Tools (FFmpeg, Chrome, Xvfb, xdotool, Fonts)
      # ────────────────────────────────────────────────────────────
      - name: "📦 Install Environment Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xdotool google-chrome-stable fonts-noto-core fonts-noto-extra
          echo ">> Environment tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. Download Background Audio
      # ────────────────────────────────────────────────────────────
      - name: "🎵 Prepare Audio Asset"
        env:
          GH_TOKEN: ${{ secrets.FARM_PAT }}
        run: |
          mkdir -p assets
          if gh release view wealth-assets --repo lefraich/mt5-farm >/dev/null 2>&1; then
            echo ">> Fetching audio asset from GitHub release..."
            gh release download wealth-assets --repo lefraich/mt5-farm --pattern "*.mp3" --dir assets --clobber || true
          fi
          
          AUDIO_FILE=$(find assets -name "*.mp3" | head -n 1)
          if [ -f "$AUDIO_FILE" ]; then
            echo ">> Found custom audio: $AUDIO_FILE"
            cp "$AUDIO_FILE" assets/music.mp3
          else
            echo ">> No custom audio uploaded, creating ambient background sound..."
            ffmpeg -f lavfi -i "sine=frequency=300:sample_rate=44100" -t 10 -b:a 128k assets/music.mp3 -y
          fi

      # ────────────────────────────────────────────────────────────
      # 3. Launch Web Dashboard & Stream Live via FFmpeg
      # ────────────────────────────────────────────────────────────
      - name: "🔴 LIVE Stream Wealth Dashboard to YouTube"
        env:
          KEY_SECRET: ${{ secrets.WEALTH_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          # ── Resolve Stream Key ──
          STREAM_KEY=""
          if [ -n "$KEY_INPUT" ]; then
            STREAM_KEY="$KEY_INPUT"
          elif [ -n "$KEY_SECRET" ]; then
            STREAM_KEY="$KEY_SECRET"
          else
            echo "::error::No stream key provided! Set secret WEALTH_STREAM_KEY or pass stream_key input"
            exit 1
          fi

          # ── YouTube Backup RTMP Server (separate hostname = no collision) ──
          RTMP_URL="rtmp://b.rtmp.youtube.com/live2/${STREAM_KEY}"

          # ── Start Xvfb (1920x1080 24-bit) ──
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 3

          # ── Create Chrome profile with Translate DISABLED via Preferences file ──
          CHROME_DIR="/tmp/chrome-wealth"
          mkdir -p "$CHROME_DIR/Default"
          cat > "$CHROME_DIR/Default/Preferences" << 'PREFS'
          {
            "translate": {"enabled": false},
            "translate_blocked_languages": ["ar","en","fr","es","de","zh","ja","ko","ru","pt","it"],
            "browser": {"has_seen_welcome_page": true, "check_default_browser": false},
            "profile": {"default_content_setting_values": {"notifications": 2}},
            "search": {"suggest_enabled": false}
          }
          PREFS
          cat > "$CHROME_DIR/First Run" < /dev/null

          echo ">> Chrome Preferences written to $CHROME_DIR"

          # ── Launch Chrome in kiosk mode ──
          DASHBOARD_URL="file://${GITHUB_WORKSPACE}/wealth_dashboard.html"
          echo ">> Opening: $DASHBOARD_URL"

          google-chrome \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-translate \
            --disable-features=Translate,TranslateUI,SearchEngineChoiceScreen,InfoBars,MediaRouter \
            --disable-infobars \
            --disable-notifications \
            --disable-popup-blocking \
            --disable-component-update \
            --disable-background-networking \
            --disable-sync \
            --disable-extensions \
            --force-device-scale-factor=1 \
            --hide-scrollbars \
            --kiosk \
            --window-size=1920,1080 \
            --window-position=0,0 \
            --user-data-dir="$CHROME_DIR" \
            "$DASHBOARD_URL" &

          CHROME_PID=$!
          sleep 6

          # ── Force window to exact 1920x1080 via xdotool ──
          WIN_ID=$(xdotool search --pid $CHROME_PID --name "" 2>/dev/null | head -n1 || true)
          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate "$WIN_ID" 2>/dev/null || true
            xdotool windowfocus "$WIN_ID" 2>/dev/null || true
            xdotool windowsize "$WIN_ID" 1920 1080 2>/dev/null || true
            xdotool windowmove "$WIN_ID" 0 0 2>/dev/null || true
            echo ">> Chrome window forced to 1920x1080 at (0,0)"
          else
            echo ">> Warning: Could not find Chrome window via xdotool"
          fi
          sleep 2

          echo "============================================"
          echo "  💰 Ronaldo vs Elon Musk Wealth Battle"
          echo "============================================"
          echo "  Resolution : 1920x1080"
          echo "  RTMP Target: rtmp://b.rtmp.youtube.com/live2/****"
          echo "  Chrome PID : $CHROME_PID"
          echo "============================================"

          # ── FFmpeg: capture X11 screen + audio → RTMP ──
          ffmpeg -hide_banner -loglevel warning \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99.0 \
            -stream_loop -1 -i assets/music.mp3 \
            -c:v libx264 -preset superfast -pix_fmt yuv420p \
            -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_URL"
