name: "💰 Ronaldo vs Elon Musk Wealth Battle Stream"

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: "Stream Key for Wealth Battle Live"
        required: false
      quality:
        description: "Stream Quality"
        required: false
        default: "1080p"
        type: choice
        options:
          - 720p
          - 1080p

permissions:
  contents: read

jobs:
  wealth-stream:
    name: "💰 Wealth Battle Stream"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. Install Tools (FFmpeg, Chrome, Xvfb, Fonts)
      # ────────────────────────────────────────────────────────────
      - name: "📦 Install Environment Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb google-chrome-stable fonts-noto-core fonts-noto-extra fonts-jetbrains-mono
          echo ">> Environment tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. Download Background Audio
      # ────────────────────────────────────────────────────────────
      - name: "🎵 Prepare Audio Asset"
        env:
          GH_TOKEN: ${{ secrets.FARM_PAT }}
        run: |
          mkdir -p assets
          if gh release view wealth-assets --repo lefraich/mt5-farm >/dev/null 2>&1; then
            echo ">> Fetching audio asset from GitHub release..."
            gh release download wealth-assets --repo lefraich/mt5-farm --pattern "*.mp3" --dir assets --clobber || true
          fi
          
          AUDIO_FILE=$(find assets -name "*.mp3" | head -n 1)
          if [ -f "$AUDIO_FILE" ]; then
            echo ">> Found custom audio: $AUDIO_FILE"
            cp "$AUDIO_FILE" assets/music.mp3
          else
            echo ">> No custom audio uploaded, creating ambient background sound..."
            ffmpeg -f lavfi -i "sine=frequency=300:sample_rate=44100" -t 10 -b:a 128k assets/music.mp3 -y
          fi

      # ────────────────────────────────────────────────────────────
      # 3. Launch Web Dashboard & Stream Live via FFmpeg
      # ────────────────────────────────────────────────────────────
      - name: "🔴 LIVE Stream Wealth Dashboard to YouTube"
        env:
          KEY_SECRET: ${{ secrets.WEALTH_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          # Retrieve Stream Key
          STREAM_KEY=""
          if [ -n "$KEY_SECRET" ]; then
            STREAM_KEY="$KEY_SECRET"
          elif [ -n "$KEY_INPUT" ]; then
            STREAM_KEY="$KEY_INPUT"
          else
            echo "::error::No stream key provided! Set secret WEALTH_STREAM_KEY or pass stream_key input"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

          # Start Virtual X Display (1920x1080, 24bit)
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3

          # Launch Chrome Fullscreen with wealth_dashboard.html (Suppressing first-run popups)
          DASHBOARD_PATH="file://$GITHUB_WORKSPACE/wealth_dashboard.html"
          echo ">> Launching Chrome with $DASHBOARD_PATH..."
          google-chrome --no-sandbox --disable-setuid-sandbox --no-first-run --no-default-browser-check --disable-features=Translate --disable-search-engine-choice-screen --kiosk --window-size=1920,1080 --window-position=0,0 --user-data-dir=/tmp/chrome-profile "$DASHBOARD_PATH" &
          sleep 5

          echo "============================================"
          echo "  💰 Ronaldo vs Elon Musk Wealth Battle Stream"
          echo "============================================"
          echo "  Target Resolution: 1920x1080"
          echo "  RTMP: rtmp://a.rtmp.youtube.com/live2/****"
          echo "============================================"

          # FFmpeg X11 Screen Capture + Audio Loop -> RTMP
          ffmpeg -hide_banner -loglevel warning \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99.0 \
            -stream_loop -1 -i assets/music.mp3 \
            -c:v libx264 -preset superfast -pix_fmt yuv420p \
            -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_URL"
