name: "\U0001F4FA YouTube Stream Farm"

# =============================================================================
#  مزرعة البث المباشر على YouTube
#  ─────────────────────────────────
#  تعمل بالكامل على GitHub Actions (مستودع عام = مجاني وغير محدود).
#  تحمّل فيديوهات قناتك بـ yt-dlp ثم تبثها في حلقة مستمرة عبر FFmpeg.
#  مدة الجلسة الواحدة: ~5h40m ← يُعاد تشغيلها تلقائياً بواسطة watchdog.yml
#
#  الأسرار المطلوبة:
#    YOUTUBE_STREAM_KEY = مفتاح البث من YouTube Studio
#    FARM_PAT           = GitHub token لإعادة التشغيل التلقائي
#
#  التشغيل: StreamLive.bat start  (أو يدوياً من Actions → Run workflow)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "YouTube Channel ID"
        required: false
        default: "UCEMC9kpN4O2aF9wAHrRMDXw"
      video_count:
        description: "عدد آخر فيديوهات للتحميل (0 = الكل)"
        required: false
        default: "0"
      quality:
        description: "جودة البث"
        required: false
        default: "720p"
        type: choice
        options:
          - 480p
          - 720p
          - 1080p
      stream_key:
        description: "Stream key (اختياري - يُستخدم السر إن وُجد)"
        required: false

permissions:
  contents: read

jobs:
  stream-1:
    name: "\U0001F4FA stream-1"
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. تثبيت الأدوات: FFmpeg + yt-dlp
      # ────────────────────────────────────────────────────────────
      - name: "\U0001F4E6 Install FFmpeg + yt-dlp"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          Write-Output ">> Downloading FFmpeg..."
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "$tools\ffmpeg.zip" -UseBasicParsing
          Expand-Archive "$tools\ffmpeg.zip" -DestinationPath $tools -Force

          Write-Output ">> Downloading yt-dlp..."
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "$tools\yt-dlp.exe" -UseBasicParsing

          # Verify
          $ffmpeg = Get-ChildItem $tools -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $tools -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Write-Output "ffmpeg:  $($ffmpeg.FullName)"
          Write-Output "ffprobe: $($ffprobe.FullName)"
          Write-Output "yt-dlp:  $tools\yt-dlp.exe"
          Write-Output ">> Tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. تحميل فيديوهات القناة
      # ────────────────────────────────────────────────────────────
      - name: "\U0001F4E5 Download channel videos"
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel_id }}
          COUNT: ${{ inputs.video_count }}
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          $ErrorActionPreference = "Stop"
          $yt = Join-Path $env:GITHUB_WORKSPACE "tools\yt-dlp.exe"
          $videos = "C:\videos"
          New-Item -ItemType Directory -Force -Path $videos | Out-Null

          $cookiesFile = Join-Path $env:GITHUB_WORKSPACE "cookies.txt"
          $hasCookies = $false
          if (-not [string]::IsNullOrWhiteSpace($env:COOKIES)) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($cookiesFile, $env:COOKIES.Trim(), $utf8NoBom)
            Write-Output ">> YOUTUBE_COOKIES secret loaded into cookies.txt (No BOM)"
            $hasCookies = $true
          } else {
            Write-Output ">> No YOUTUBE_COOKIES secret found"
          }

          $count = [int]$env:COUNT
          $ch = "https://www.youtube.com/channel/$env:CHANNEL/videos"

          Write-Output ">> Fetching video list from channel $env:CHANNEL..."
          $listArgs = @("--flat-playlist", "-J", "--no-warnings")
          if ($hasCookies) { $listArgs += @("--cookies", $cookiesFile) }
          $raw = @(& $yt $listArgs $ch) -join "`n"
          $d = $raw | ConvertFrom-Json
          $entries = @($d.entries)
          if ($count -gt 0) { $entries = @($entries | Select-Object -First $count) }
          if (-not $entries -or $entries.Count -eq 0) { Write-Error "No videos found on channel" }

          Write-Output ">> Found $($entries.Count) video(s). Downloading..."
          $i = 0
          foreach ($e in $entries) {
            $i++
            $url = "https://www.youtube.com/watch?v=$($e.id)"
            Write-Output "  $i/$($entries.Count) [$($e.id)] $($e.title)"
            $dlArgs = @("-f", "18/22/17/best", "--no-warnings", "--no-progress", "-o", "$videos\%(id)s.%(ext)s")
            if ($hasCookies) { $dlArgs += @("--cookies", $cookiesFile) }
            & $yt $dlArgs $url
          }

          $got = Get-ChildItem $videos -File -ErrorAction SilentlyContinue
          Write-Output ""
          Write-Output ">> Downloaded: $($got.Count) file(s)"
          $totalMB = 0
          $got | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 1)
            $totalMB += $mb
            Write-Output "   - $($_.Name) ($mb MB)"
          }
          Write-Output ">> Total size: $([math]::Round($totalMB, 1)) MB"

          if ($got.Count -eq 0) { Write-Error "No videos could be downloaded" }

      # ────────────────────────────────────────────────────────────
      # 3. بث مستمر إلى YouTube (~5h40m)
      # ────────────────────────────────────────────────────────────
      - name: "\U0001F534 LIVE Stream to YouTube"
        shell: pwsh
        env:
          KEY_SECRET: ${{ secrets.YOUTUBE_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "tools"
          $ffmpeg  = (Get-ChildItem $tools -Recurse -Filter ffmpeg.exe  | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem $tools -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          $videos = "C:\videos"
          $files = Get-ChildItem $videos -File | Where-Object { $_.Extension -in @(".mp4",".mkv",".webm",".mov") }
          if ($files.Count -eq 0) { Write-Error "No video files found" }

          # ── مفتاح البث ──
          $key = ""
          if (-not [string]::IsNullOrEmpty($env:KEY_SECRET)) { $key = $env:KEY_SECRET }
          elseif (-not [string]::IsNullOrEmpty($env:KEY_INPUT)) { $key = $env:KEY_INPUT }
          else { Write-Error "No stream key! Set secret YOUTUBE_STREAM_KEY or pass stream_key input" }
          $rtmp = "rtmp://a.rtmp.youtube.com/live2/$key"

          # ── إعدادات الجودة ──
          $quality = if ($env:QUALITY) { $env:QUALITY } else { "720p" }
          switch ($quality) {
            "480p"  { $vScale = "scale=-2:480";  $vBit = "1500k"; $vBuf = "3000k";  $preset = "superfast" }
            "1080p" { $vScale = "scale=-2:1080"; $vBit = "4500k"; $vBuf = "9000k";  $preset = "veryfast" }
            default { $vScale = "scale=-2:720";  $vBit = "2500k"; $vBuf = "5000k";  $preset = "veryfast" }
          }

          Write-Output "============================================"
          Write-Output "  YouTube Live Stream Engine"
          Write-Output "============================================"
          Write-Output "  Quality:  $quality"
          Write-Output "  Bitrate:  $vBit"
          Write-Output "  Videos:   $($files.Count) files"
          Write-Output "  RTMP:     rtmp://a.rtmp.youtube.com/live2/****"
          Write-Output "============================================"

          # ── ملفات العمل ──
          $listPath = Join-Path $env:GITHUB_WORKSPACE "concat-list.txt"
          $ffOut = Join-Path $env:GITHUB_WORKSPACE "ff-out.log"
          $ffErr = Join-Path $env:GITHUB_WORKSPACE "ff-err.log"
          $totalMin = 340        # ~5h40m
          $runTargetSec = 330 * 60
          $start = Get-Date
          $lastBeat = Get-Date
          $restarts = 0
          $inv = [System.Globalization.CultureInfo]::InvariantCulture

          while ($true) {
            if (((Get-Date) - $start).TotalMinutes -ge $totalMin) {
              Write-Output ">> Duration reached ($totalMin min), stopping gracefully"
              break
            }

            # ── فحص مدة كل فيديو ──
            $probes = @()
            foreach ($f in $files) {
              $dur = 0.0
              $o = @(& $ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 -- $f.FullName) -join "`n"
              if ($o) {
                [double]::TryParse(($o.Trim().Split("`n") | Select-Object -Last 1), [System.Globalization.NumberStyles]::Float, $inv, [ref]$dur) | Out-Null
              }
              $hasAudio = $false
              $ao = @(& $ffprobe -v error -select_streams a -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 -- $f.FullName) -join "`n"
              if ($ao) { $hasAudio = $true }
              if ($dur -gt 0) {
                $probes += [pscustomobject]@{ F = $f; D = $dur; A = $hasAudio }
              }
            }
            if ($probes.Count -eq 0) { Write-Error "No usable videos after probing" }
            $allAudio = (@($probes | Where-Object { -not $_.A }).Count -eq 0)

            # ── بناء قائمة التشغيل ──
            $lines = New-Object System.Collections.Generic.List[string]
            $cov = 0.0; $idx = 0
            while ($cov -lt $runTargetSec) {
              $r = $probes[$idx % $probes.Count]
              $p = $r.F.FullName.Replace('\', '/') -replace "'", "'\\''"
              $lines.Add("file '$p'")
              $cov += $r.D
              $idx++
            }
            [IO.File]::WriteAllLines($listPath, $lines, (New-Object Text.UTF8Encoding($false)))
            Write-Output ">> Playlist: $($lines.Count) entries, ~$([math]::Round($cov/60,1)) min of content"

            # ── أوامر FFmpeg ──
            $ffArgs = @(
              "-hide_banner", "-nostdin", "-loglevel", "warning",
              "-re",
              "-f", "concat", "-safe", "0", "-i", $listPath
            )
            if ($allAudio) {
              $ffArgs += @("-map", "0:v:0", "-map", "0:a:0")
            } else {
              $ffArgs += @("-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo",
                           "-map", "0:v:0", "-map", "1:a:0", "-shortest")
            }
            $ffArgs += @(
              "-vf", $vScale,
              "-c:v", "libx264", "-preset", $preset, "-pix_fmt", "yuv420p",
              "-b:v", $vBit, "-maxrate", $vBit, "-bufsize", $vBuf,
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-c:a", "aac", "-b:a", "128k", "-ar", "44100",
              "-rw_timeout", "8000000",
              "-f", "flv", $rtmp
            )

            $ffArgsQ = @($ffArgs | ForEach-Object { if ($_ -match "\s") { '"' + $_ + '"' } else { $_ } })

            # ── تشغيل FFmpeg ──
            $proc = Start-Process -FilePath $ffmpeg -ArgumentList $ffArgsQ `
              -NoNewWindow -RedirectStandardOutput $ffOut -RedirectStandardError $ffErr -PassThru

            $restarts++
            Write-Output ">> STREAMING pid=$($proc.Id) attempt=#$restarts at $((Get-Date).ToString('HH:mm:ss'))"

            while (-not $proc.HasExited) {
              Start-Sleep -Seconds 30
              $now = Get-Date
              if (($now - $lastBeat).TotalMinutes -ge 15) {
                $lastBeat = $now
                $elapsed = [math]::Round(($now - $start).TotalMinutes, 0)
                Write-Output "[$($now.ToString('HH:mm:ss'))] LIVE | elapsed ${elapsed}m | restarts $restarts"
                if (Test-Path $ffErr) {
                  Get-Content $ffErr -Tail 2 | ForEach-Object { Write-Output "   | $_" }
                }
              }
              if (($now - $start).TotalMinutes -ge $totalMin) { break }
            }

            $proc.WaitForExit(5000) | Out-Null
            Write-Output ">> FFmpeg exited code=$($proc.ExitCode) - restarting in 10s..."
            if (Test-Path $ffErr) {
              Get-Content $ffErr -Tail 5 | ForEach-Object { Write-Output "   | $_" }
            }
            Start-Sleep -Seconds 10
          }

          Write-Output ""
          Write-Output "============================================"
          Write-Output "  Stream session finished"
          Write-Output "  Total runtime: $([math]::Round(((Get-Date)-$start).TotalHours, 2)) hours"
          Write-Output "  Total restarts: $restarts"
          Write-Output "  Watchdog will restart a new session..."
          Write-Output "============================================"

      # ────────────────────────────────────────────────────────────
      # 4. تنظيف
      # ────────────────────────────────────────────────────────────
      - name: "\U0001F9F9 Cleanup"
        if: always()
        shell: pwsh
        run: |
          Get-Process ffmpeg -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Output "cleanup done"
