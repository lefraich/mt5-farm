name: "📺 YouTube Video Stream Farm (Google Drive Engine)"

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: "Google Drive Folder or File URL"
        required: false
        default: "https://drive.google.com/drive/folders/1rRDpSNWQuGHy6K41zIij5qwSlWftItEA"
      quality:
        description: "Stream Quality"
        required: false
        default: "720p"
        type: choice
        options:
          - 480p
          - 720p
          - 1080p
      stream_key:
        description: "Stream Key (Optional - uses secret if empty)"
        required: false

permissions:
  contents: read

jobs:
  video-stream:
    name: "📺 Video Stream from Google Drive"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. Install Environment Tools (FFmpeg, Python, gdown)
      # ────────────────────────────────────────────────────────────
      - name: "📦 Install FFmpeg & gdown"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --upgrade gdown --break-system-packages || pip3 install --upgrade gdown
          echo ">> Environment tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. Download Videos from Google Drive (Gigabit Speed)
      # ────────────────────────────────────────────────────────────
      - name: "⚡ Fast Download from Google Drive"
        env:
          GDRIVE_URL: ${{ inputs.gdrive_url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/videos"
          
          python3 - << 'EOF'
          import re, os, sys, gdown

          raw_url = os.environ.get("GDRIVE_URL", "https://drive.google.com/drive/folders/1rRDpSNWQuGHy6K41zIij5qwSlWftItEA")
          out_dir = os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "videos")
          os.makedirs(out_dir, exist_ok=True)

          print(f">> Processing Google Drive URL: {raw_url}")

          # Extract folder ID
          folder_match = re.search(r'folders/([a-zA-Z0-9_-]+)', raw_url)
          if folder_match:
              folder_id = folder_match.group(1)
              print(f">> Detected Folder ID: {folder_id}")
              gdown.download_folder(id=folder_id, output=out_dir, quiet=False, use_cookies=False)
          else:
              # Fallback to single file or raw URL
              print(">> Downloading as direct item...")
              gdown.download(url=raw_url, output=out_dir, quiet=False, fuzzy=True)
          EOF

          # Move all nested media files up to root videos directory
          find "$GITHUB_WORKSPACE/videos" -mindepth 2 -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.mov" -o -iname "*.avi" \) -exec mv -t "$GITHUB_WORKSPACE/videos" {} + 2>/dev/null || true

          echo "============================================"
          echo ">> Downloaded Video Files in $GITHUB_WORKSPACE/videos:"
          ls -lh "$GITHUB_WORKSPACE/videos"
          echo "============================================"

      # ────────────────────────────────────────────────────────────
      # 3. LIVE Stream Continuous Loop via FFmpeg to YouTube (~5h40m)
      # ────────────────────────────────────────────────────────────
      - name: "🔴 LIVE Stream to YouTube"
        env:
          KEY_SECRET: ${{ secrets.YOUTUBE_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          # Resolve Stream Key
          STREAM_KEY=""
          if [ -n "$KEY_INPUT" ]; then
            STREAM_KEY="$KEY_INPUT"
          elif [ -n "$KEY_SECRET" ]; then
            STREAM_KEY="$KEY_SECRET"
          else
            echo "::error::No stream key provided! Set secret YOUTUBE_STREAM_KEY or pass stream_key input"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

          # Quality presets
          case "${QUALITY:-720p}" in
            480p)
              V_SCALE="scale=-2:480"
              V_BIT="1500k"
              V_BUF="3000k"
              PRESET="veryfast"
              ;;
            1080p)
              V_SCALE="scale=-2:1080"
              V_BIT="4500k"
              V_BUF="9000k"
              PRESET="veryfast"
              ;;
            *)
              V_SCALE="scale=-2:720"
              V_BIT="2500k"
              V_BUF="5000k"
              PRESET="veryfast"
              ;;
          esac

          VIDEOS_DIR="$GITHUB_WORKSPACE/videos"
          
          # Collect video files (case insensitive)
          shopt -s nullglob nocaseglob
          VIDEO_FILES=("$VIDEOS_DIR"/*.mp4 "$VIDEOS_DIR"/*.mkv "$VIDEOS_DIR"/*.mov "$VIDEOS_DIR"/*.webm "$VIDEOS_DIR"/*.avi)
          shopt -u nullglob nocaseglob

          if [ ${#VIDEO_FILES[@]} -eq 0 ]; then
            echo "::error::No video files found in $VIDEOS_DIR after download!"
            exit 1
          fi

          echo ">> Found ${#VIDEO_FILES[@]} video file(s) for broadcasting"

          # Build FFmpeg Concat Playlist
          PLAYLIST="$GITHUB_WORKSPACE/playlist.txt"
          rm -f "$PLAYLIST"
          
          # Loop list to cover ~6 hours
          for loop in {1..30}; do
            for f in "${VIDEO_FILES[@]}"; do
              echo "file '$f'" >> "$PLAYLIST"
            done
          done

          echo "============================================"
          echo "  YouTube 24/7 Live Stream Engine"
          echo "============================================"
          echo "  Quality:  $QUALITY"
          echo "  Bitrate:  $V_BIT"
          echo "  Videos:   ${#VIDEO_FILES[@]} unique files in loop"
          echo "  RTMP:     rtmp://a.rtmp.youtube.com/live2/****"
          echo "============================================"

          # Stream to YouTube via FFmpeg
          ffmpeg -hide_banner -loglevel warning \
            -re \
            -f concat -safe 0 -i "$PLAYLIST" \
            -vf "$V_SCALE" \
            -c:v libx264 -preset "$PRESET" -pix_fmt yuv420p \
            -b:v "$V_BIT" -maxrate "$V_BIT" -bufsize "$V_BUF" \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_URL"
