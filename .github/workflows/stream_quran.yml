name: "📖 24/7 Holy Quran Live Stream"

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: "Stream Key for Quran Live"
        required: false
      quality:
        description: "Stream Quality"
        required: false
        default: "1080p"
        type: choice
        options:
          - 720p
          - 1080p

permissions:
  contents: read

jobs:
  quran-stream:
    name: "📖 24/7 Holy Quran Live Broadcast"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. Install Tools (FFmpeg, Chrome, Xvfb, Fonts)
      # ────────────────────────────────────────────────────────────
      - name: "📦 Install Environment Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb google-chrome-stable fonts-noto-core fonts-noto-extra fonts-jetbrains-mono
          echo ">> Environment tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. Download Sheikh Al-Sudais Quran Audio
      # ────────────────────────────────────────────────────────────
      - name: "🎵 Download Sheikh Al-Sudais Recitation"
        run: |
          mkdir -p assets
          echo ">> Downloading Sheikh Al-Sudais recitation..."
          curl -sL "https://server11.mp3quran.net/sds/001.mp3" -o assets/001.mp3
          curl -sL "https://server11.mp3quran.net/sds/002.mp3" -o assets/002.mp3
          curl -sL "https://server11.mp3quran.net/sds/036.mp3" -o assets/036.mp3
          curl -sL "https://server11.mp3quran.net/sds/055.mp3" -o assets/055.mp3
          curl -sL "https://server11.mp3quran.net/sds/067.mp3" -o assets/067.mp3

          # Merge cleanly using FFmpeg concat protocol into MP3
          ffmpeg -hide_banner -loglevel warning -i "concat:assets/001.mp3|assets/002.mp3|assets/036.mp3|assets/055.mp3|assets/067.mp3" -c copy assets/quran.mp3 -y
          echo ">> Master Quran audio stream ready: $(ls -lh assets/quran.mp3)"

      # ────────────────────────────────────────────────────────────
      # 3. Launch Web Dashboard & Stream Live via FFmpeg
      # ────────────────────────────────────────────────────────────
      - name: "🔴 LIVE Stream Holy Quran to YouTube"
        env:
          KEY_SECRET: ${{ secrets.QURAN_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          STREAM_KEY=""
          if [ -n "$KEY_INPUT" ]; then
            STREAM_KEY="$KEY_INPUT"
          elif [ -n "$KEY_SECRET" ]; then
            STREAM_KEY="$KEY_SECRET"
          else
            echo "::error::No stream key provided! Set secret QURAN_STREAM_KEY or pass stream_key input"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

          # Start Virtual X Display (1920x1080, 24bit)
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3

          # Launch Chrome Fullscreen with quran_dashboard.html
          DASHBOARD_PATH="file://$GITHUB_WORKSPACE/quran_dashboard.html"
          echo ">> Launching Chrome with $DASHBOARD_PATH..."
          google-chrome --no-sandbox --disable-setuid-sandbox --no-first-run --no-default-browser-check --disable-features=Translate --disable-search-engine-choice-screen --kiosk --window-size=1920,1080 --window-position=0,0 --user-data-dir=/tmp/chrome-profile "$DASHBOARD_PATH" &
          sleep 5

          echo "============================================"
          echo "  📖 24/7 Holy Quran Live Stream"
          echo "  Reciter: Sheikh Abdul Rahman Al-Sudais"
          echo "  Target Resolution: 1920x1080 Full HD (16:9)"
          echo "  RTMP: rtmp://a.rtmp.youtube.com/live2/****"
          echo "============================================"

          # FFmpeg X11 Screen Capture + Audio Loop -> RTMP (Exact working engine)
          ffmpeg -hide_banner -loglevel warning \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99.0 \
            -stream_loop -1 -i assets/quran.mp3 \
            -c:v libx264 -preset superfast -pix_fmt yuv420p \
            -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_URL"
