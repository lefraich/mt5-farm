name: "📖 24/7 Holy Quran Live Stream"

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: "Stream Key for Quran Live"
        required: false
      quality:
        description: "Stream Quality"
        required: false
        default: "1080p"
        type: choice
        options:
          - 720p
          - 1080p

permissions:
  contents: read

jobs:
  quran-stream:
    name: "📖 24/7 Holy Quran Live Broadcast"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # 1. Install Tools (FFmpeg, Chrome, Xvfb, PulseAudio, Fonts)
      # ────────────────────────────────────────────────────────────
      - name: "📦 Install Environment Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xdotool pulseaudio alsa-utils google-chrome-stable fonts-noto-core fonts-noto-extra fonts-amiri
          echo ">> Environment tools ready"

      # ────────────────────────────────────────────────────────────
      # 2. Launch Virtual Display, PulseAudio, Chrome & Stream
      # ────────────────────────────────────────────────────────────
      - name: "🔴 LIVE Stream Holy Quran to YouTube"
        env:
          KEY_SECRET: ${{ secrets.QURAN_STREAM_KEY }}
          KEY_INPUT: ${{ inputs.stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          STREAM_KEY=""
          if [ -n "$KEY_INPUT" ]; then
            STREAM_KEY="$KEY_INPUT"
          elif [ -n "$KEY_SECRET" ]; then
            STREAM_KEY="$KEY_SECRET"
          else
            echo "::error::No stream key provided! Set secret QURAN_STREAM_KEY or pass stream_key input"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"

          # Start Virtual X Display (1920x1080, 24bit)
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          # Start PulseAudio for Internal Browser Audio Capture
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink || true
          pactl set-default-sink VirtualSink || true
          pactl set-default-source VirtualSink.monitor || true
          sleep 2

          # Create Chrome Profile
          CHROME_DIR="/tmp/chrome-quran"
          mkdir -p "$CHROME_DIR/Default"
          cat > "$CHROME_DIR/Default/Preferences" << 'PREFS'
          {
            "translate": {"enabled": false},
            "translate_blocked_languages": ["ar","en","fr","es","de"],
            "browser": {"has_seen_welcome_page": true, "check_default_browser": false},
            "profile": {"default_content_setting_values": {"notifications": 2}}
          }
          PREFS
          cat > "$CHROME_DIR/First Run" < /dev/null

          DASHBOARD_URL="file://${GITHUB_WORKSPACE}/quran_dashboard.html"
          echo ">> Opening: $DASHBOARD_URL"

          google-chrome \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --disable-translate \
            --disable-features=Translate,TranslateUI,SearchEngineChoiceScreen,InfoBars \
            --disable-infobars \
            --force-device-scale-factor=1 \
            --hide-scrollbars \
            --kiosk \
            --window-size=1920,1080 \
            --window-position=0,0 \
            --user-data-dir="$CHROME_DIR" \
            "$DASHBOARD_URL" &

          CHROME_PID=$!
          sleep 6

          # Force 1920x1080 resolution
          WIN_ID=$(xdotool search --pid $CHROME_PID --name "" 2>/dev/null | head -n1 || true)
          if [ -n "$WIN_ID" ]; then
            xdotool windowsize "$WIN_ID" 1920 1080 2>/dev/null || true
            xdotool windowmove "$WIN_ID" 0 0 2>/dev/null || true
          fi
          sleep 2

          echo "============================================"
          echo "  📖 24/7 Holy Quran Live Stream"
          echo "  Reciter: Sheikh Abdul Rahman Al-Sudais"
          echo "  Resolution : 1920x1080"
          echo "  RTMP Target: rtmp://a.rtmp.youtube.com/live2/****"
          echo "============================================"

          # FFmpeg capture X11 screen + PulseAudio (Chrome Sound) -> RTMP
          ffmpeg -hide_banner -loglevel warning \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99.0 \
            -f pulse -i VirtualSink.monitor \
            -c:v libx264 -preset superfast -pix_fmt yuv420p \
            -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 192k -ar 44100 \
            -f flv "$RTMP_URL"
