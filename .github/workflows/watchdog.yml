name: "\U0001F436 Stream Watchdog"

# =============================================================================
#  حارس البث — يعيد تشغيل stream_farm.yml كل 5 ساعات
#  ─────────────────────────────────────────────────────
#  لأن GitHub Actions يُوقف الجلسة بعد ~6 ساعات، هذا الحارس يبدأ جلسة جديدة
#  قبل أن تنتهي السابقة. النتيجة: بث مستمر 24/7 ♾️
#
#  التحكم:
#    - لبدء البث المستمر: أنشئ ملف KEEP_STREAMING في المستودع
#    - لإيقاف البث: احذف ملف KEEP_STREAMING
#    - StreamLive.bat يفعل هذا تلقائياً (start/stop)
#
#  الأسرار المطلوبة:
#    FARM_PAT = GitHub Personal Access Token (repo + workflow scopes)
# =============================================================================

on:
  schedule:
    - cron: "0 */5 * * *"     # كل 5 ساعات: 00:00, 05:00, 10:00, 15:00, 20:00
  workflow_dispatch:           # تشغيل يدوي أيضاً

permissions:
  contents: read

jobs:
  watchdog:
    name: "\U0001F436 Stream Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F50D Check KEEP_STREAMING flag"
        id: check
        run: |
          if [ -f "KEEP_STREAMING" ]; then
            echo "streaming=true" >> "$GITHUB_OUTPUT"
            echo "✅ KEEP_STREAMING file found — will restart stream"
          else
            echo "streaming=false" >> "$GITHUB_OUTPUT"
            echo "⏹️ KEEP_STREAMING file NOT found — stream stays off"
          fi

      - name: "\U0001F504 Restart Stream Farm"
        if: steps.check.outputs.streaming == 'true'
        env:
          PAT: ${{ secrets.FARM_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo ">> Dispatching stream_farm.yml..."

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$REPO/actions/workflows/stream_farm.yml/dispatches")

          echo "HTTP response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Stream farm dispatched successfully!"
          else
            echo "❌ Failed to dispatch (HTTP $HTTP_CODE)"
            cat /tmp/response.txt
            exit 1
          fi

      - name: "\U0001F4CA Summary"
        run: |
          echo "## 🐶 Stream Watchdog Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          if [ -f "KEEP_STREAMING" ]; then
            echo "| KEEP_STREAMING | ✅ Present |" >> $GITHUB_STEP_SUMMARY
            echo "| Action | 🔄 Dispatched stream_farm.yml |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| KEEP_STREAMING | ❌ Not found |" >> $GITHUB_STEP_SUMMARY
            echo "| Action | ⏸️ No action taken |" >> $GITHUB_STEP_SUMMARY
          fi
